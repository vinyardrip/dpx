# =================================================================
# DPX Configuration File dpx/config/dpx.conf 1.0.0
# =================================================================
# Это файл конфигурации по умолчанию для DPX.
# Скопируйте его в ~/.config/dpx/dpx.conf для пользовательских настроек.
# =================================================================

# --- Пути к базам данных ---
# Папка для продакшен-дампов БД
db_prod_path = ~/projects/work/db_prod

# Папка для локальных бэкапов БД
db_local_path = ~/projects/work/db_local

# --- DDEV проекты ---
# Базовая папка для DDEV проектов
ddev_projects_base_path = ~/projects/work/php

# --- Devilbox (для миграции) ---
# Путь к корневой папке Devilbox
devilbox_path_root = ~/projects/work/devilbox

# Путь к папке данных Devilbox (сайтам)
devilbox_data_base_path = ~/projects/work/devilbox/data

# --- Настройки по умолчанию ---
# Версия PHP для новых проектов
default_php_version = 7.4

# Тип базы данных (mysql, mariadb)
default_db_type = mysql

# Версия базы данных
default_db_version = 5.7

# Доменная зона продакшена по умолчанию
default_prod_tld = by

# --- WordPress ---
# Путь к стартовой теме (для new-wp)
starter_theme_path = ~/projects/work/_s-template

# --- DDEV настройки ---
# TLD для локальных проектов
project_tld = lo

# --- Учётные данные WordPress (для auto-install) ---
admin_user = admin
admin_email = admin@example.com
admin_pass = admin